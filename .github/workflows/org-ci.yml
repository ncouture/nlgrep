name: Org CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  org-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install minimal Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox

      - name: Lint and fix Org files
        run: |
          cat <<'EOF' >/tmp/org-ci-lint.el
          (require 'org)
          (dolist (file command-line-args-left)
            (with-current-buffer (find-file-noselect file)
              (org-mode)
              (untabify (point-min) (point-max))
              (delete-trailing-whitespace)
              (goto-char (point-min))
              (while (re-search-forward "^\\([ \t]+\\)\\(#\\+\\)" nil t)
                (replace-match "\\2"))
              (goto-char (point-min))
              (while (re-search-forward "^\\(\\*+\\)\\([^* \n]\\)" nil t)
                (replace-match "\\1 \\2"))
              (org-table-map-tables #'org-table-align)
              (save-buffer)
              (org-lint)
              (kill-buffer)))
          EOF

          mapfile -d '' org_files < <(find "$GITHUB_WORKSPACE" -type f -name '*.org' -print0 | sort -z)
          if [ "${#org_files[@]}" -gt 0 ]; then
            emacs --batch --quick -l /tmp/org-ci-lint.el -- "${org_files[@]}"
          fi

      - name: Export README.org to README.md
        run: |
          cat <<'EOF' >/tmp/export-readme.el
          (require 'ox-md)
          (with-current-buffer
              (find-file-noselect (expand-file-name "README.org" (getenv "GITHUB_WORKSPACE")))
            (org-mode)
            (org-md-export-to-markdown))
          EOF

          emacs --batch --quick -l /tmp/export-readme.el

      - name: Commit and push generated updates
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes after git add."
            exit 0
          fi

          git commit -m "chore: normalize Org files and export README"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Skip push for fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Skipping push for fork pull requests."
