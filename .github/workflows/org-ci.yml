name: Org CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  org-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Install minimal Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox

      - name: Lint and fix Org files
        run: |
          cat <<'EOF' >/tmp/org-ci-lint.el
          (require 'org)
          (setq org-ci/lint-failed nil)
          (dolist (file command-line-args-left)
            (with-current-buffer (find-file-noselect file)
              (org-mode)
              (untabify (point-min) (point-max))
              (delete-trailing-whitespace)
              (goto-char (point-min))
              (while (re-search-forward "^\\([ \t]+\\)\\(#\\+\\)" nil t)
                (replace-match "\\2"))
              (goto-char (point-min))
              (while (re-search-forward "^\\(\\*+\\)\\([^* \n]\\)" nil t)
                (replace-match "\\1 \\2"))
              (org-table-map-tables #'org-table-align)
              (save-buffer)
              (let ((issues (org-lint)))
                (when issues
                  (setq org-ci/lint-failed t)
                  (let ((lint-buffer (get-buffer "*Org Lint*")))
                    (when lint-buffer
                      (princ (format "\nOrg lint findings for %s:\n%s\n"
                                     file
                                     (with-current-buffer lint-buffer
                                       (buffer-string))))
                      (kill-buffer lint-buffer)))))
              (kill-buffer)))
          (when org-ci/lint-failed
            (kill-emacs 1))
          EOF

          mapfile -d '' org_files < <(find "$GITHUB_WORKSPACE" -type f -name '*.org' -print0 | sort -z)
          if [ "${#org_files[@]}" -gt 0 ]; then
            emacs --batch --quick -l /tmp/org-ci-lint.el -- "${org_files[@]}"
          fi

      - name: Export README.org to README.md
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/README.org" ]; then
            echo "README.org not found; skipping export."
            exit 0
          fi

          cat <<'EOF' >/tmp/export-readme.el
          (require 'ox-md)
          (with-current-buffer
              (find-file-noselect (expand-file-name "README.org" (getenv "GITHUB_WORKSPACE")))
            (org-mode)
            (org-md-export-to-markdown))
          EOF

          emacs --batch --quick -l /tmp/export-readme.el

      - name: Check for generated updates
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Org files and README export are up to date."
            exit 0
          fi

          echo "Generated updates are required:"
          git status --short
          git diff -- . ':(exclude)README.md'
          git diff -- README.md
          exit 1

  org-apply:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: org-apply-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install minimal Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox

      - name: Lint and fix Org files
        run: |
          cat <<'EOF' >/tmp/org-ci-lint.el
          (require 'org)
          (setq org-ci/lint-failed nil)
          (dolist (file command-line-args-left)
            (with-current-buffer (find-file-noselect file)
              (org-mode)
              (untabify (point-min) (point-max))
              (delete-trailing-whitespace)
              (goto-char (point-min))
              (while (re-search-forward "^\\([ \t]+\\)\\(#\\+\\)" nil t)
                (replace-match "\\2"))
              (goto-char (point-min))
              (while (re-search-forward "^\\(\\*+\\)\\([^* \n]\\)" nil t)
                (replace-match "\\1 \\2"))
              (org-table-map-tables #'org-table-align)
              (save-buffer)
              (let ((issues (org-lint)))
                (when issues
                  (setq org-ci/lint-failed t)
                  (let ((lint-buffer (get-buffer "*Org Lint*")))
                    (when lint-buffer
                      (princ (format "\nOrg lint findings for %s:\n%s\n"
                                     file
                                     (with-current-buffer lint-buffer
                                       (buffer-string))))
                      (kill-buffer lint-buffer)))))
              (kill-buffer)))
          (when org-ci/lint-failed
            (kill-emacs 1))
          EOF

          mapfile -d '' org_files < <(find "$GITHUB_WORKSPACE" -type f -name '*.org' -print0 | sort -z)
          if [ "${#org_files[@]}" -gt 0 ]; then
            emacs --batch --quick -l /tmp/org-ci-lint.el -- "${org_files[@]}"
          fi

      - name: Export README.org to README.md
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/README.org" ]; then
            echo "README.org not found; skipping export."
            exit 0
          fi

          cat <<'EOF' >/tmp/export-readme.el
          (require 'ox-md)
          (with-current-buffer
              (find-file-noselect (expand-file-name "README.org" (getenv "GITHUB_WORKSPACE")))
            (org-mode)
            (org-md-export-to-markdown))
          EOF

          emacs --batch --quick -l /tmp/export-readme.el

      - name: Commit and push generated updates
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes after git add."
            exit 0
          fi

          git commit -m "chore: normalize Org files and export README"
          git push origin "HEAD:${GITHUB_REF_NAME}"
