name: Org CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  org-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup minimal Emacs
        uses: ./.github/actions/setup-emacs

      - name: Lint and fix Org files
        run: |
          mapfile -d '' org_files < <(find "$GITHUB_WORKSPACE" -type f -name '*.org' -print0 | sort -z)
          if [ "${#org_files[@]}" -gt 0 ]; then
            emacs --batch --quick -l "$GITHUB_WORKSPACE/.github/scripts/org-ci-lint.el" -- "${org_files[@]}"
          fi

      - name: Export README.org to README.md
        run: emacs --batch --quick -l "$GITHUB_WORKSPACE/.github/scripts/export-readme.el"

      - name: Check for generated updates
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Org files and README export are up to date."
            exit 0
          fi

          echo "Generated updates are required:"
          git status --short
          git diff -- . ':(exclude)README.md'
          git diff -- README.md
          exit 1

  org-apply:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: org-apply-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup minimal Emacs
        uses: ./.github/actions/setup-emacs

      - name: Lint and fix Org files
        run: |
          mapfile -d '' org_files < <(find "$GITHUB_WORKSPACE" -type f -name '*.org' -print0 | sort -z)
          if [ "${#org_files[@]}" -gt 0 ]; then
            emacs --batch --quick -l "$GITHUB_WORKSPACE/.github/scripts/org-ci-lint.el" -- "${org_files[@]}"
          fi

      - name: Export README.org to README.md
        run: emacs --batch --quick -l "$GITHUB_WORKSPACE/.github/scripts/export-readme.el"

      - name: Commit and push generated updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes after git add."
            exit 0
          fi

          git commit -m "chore: normalize Org files and export README"
          generated_commit="$(git rev-parse HEAD)"

          for attempt in 1 2 3; do
            git reset --hard "${generated_commit}"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying." >&2
            sleep 2
          done

          echo "Failed to push generated changes after 3 attempts." >&2
          exit 1
