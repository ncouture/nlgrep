name: Actions Workflow Security Scan

on:
  pull_request:
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".github/actions/**/*.yml"
      - ".github/actions/**/*.yaml"
      - ".github/actions/**/action.yml"
      - ".github/actions/**/action.yaml"

env:
  ACTIONS_SUITE_CONTENT: |
    - qlpack: codeql/actions-queries
    - include:
        id: actions/envvar-injection/critical
    - include:
        id: actions/envpath-injection/critical
    - include:
        id: actions/cache-poisoning/poisonable-step
    - include:
        id: actions/artifact-poisoning/critical
    - include:
        id: actions/untrusted-checkout/critical
    - include:
        id: actions/untrusted-checkout/high
  CODEQL_RESULTS_DIR: ${{ runner.temp }}/codeql-results

permissions:
  contents: read

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github

      - name: Create CodeQL query suite
        run: echo "${{ env.ACTIONS_SUITE_CONTENT }}" > actions-suite.qls

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          config: |
            name: Custom Action Scan
            disable-default-queries: true
            queries:
              - uses: ./actions-suite.qls

      - name: Perform CodeQL analysis
        id: codeql_analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: ${{ env.CODEQL_RESULTS_DIR }}
          upload: never

      - name: Locate SARIF output
        id: locate_sarif
        run: |
          sarif_file="$(find "${{ env.CODEQL_RESULTS_DIR }}" -maxdepth 1 -type f -name '*.sarif' | head -n 1)"
          if [ -n "$sarif_file" ]; then
            echo "sarif_found=true" >> "$GITHUB_OUTPUT"
            echo "sarif_file=$sarif_file" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse SARIF findings
        id: parse_sarif
        if: steps.locate_sarif.outputs.sarif_found == 'true'
        run: |
          sarif_file="${{ steps.locate_sarif.outputs.sarif_file }}"
          result_count=$(jq '[.runs[]?.results[]?] | length' "$sarif_file")
          echo "result_count=$result_count" >> "$GITHUB_OUTPUT"
          {
            echo "findings<<EOF"
            jq -r '
              .runs[]?.results[]?
              | "- **" + (.ruleId // "unknown-rule") + "**: "
                + (.message.text // "No message provided")
                + " ("
                + (.locations[0]?.physicalLocation?.artifactLocation?.uri // "unknown file")
                + ":"
                + ((.locations[0]?.physicalLocation?.region?.startLine // "unknown line") | tostring)
                + ")"
            ' "$sarif_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload SARIF to code scanning
        if: ${{ always() && steps.codeql_analysis.conclusion == 'success' && steps.locate_sarif.outputs.sarif_found == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.locate_sarif.outputs.sarif_file }}

      - name: Check for vulnerabilities and set status
        id: vuln_check
        run: |
          if [ "${{ steps.locate_sarif.outputs.sarif_found }}" != 'true' ]; then
            echo "SARIF file not found under ${{ env.CODEQL_RESULTS_DIR }}"
            exit 1
          fi
          if [ "${{ steps.parse_sarif.outputs.result_count }}" -gt 0 ]; then
            result_count="${{ steps.parse_sarif.outputs.result_count }}"
            echo "::error::CodeQL found $result_count potential vulnerabilities."
            echo "---"
            printf '%s\n' "${{ steps.parse_sarif.outputs.findings }}"
            exit 1
          fi

          echo "No vulnerabilities found."

      - name: Explain failures and next steps
        if: ${{ failure() && steps.codeql_analysis.conclusion != 'skipped' }}
        run: |
          sarif_file="${{ steps.locate_sarif.outputs.sarif_file }}"
          {
            echo "### Security scan results"
            echo
            echo "This automated scan checks for common GitHub Actions security issues in workflow and composite action files."
            echo "Review any flagged findings before merging."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$sarif_file" ] && [ -f "$sarif_file" ]; then
            echo "#### Findings" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "${{ steps.parse_sarif.outputs.findings }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SARIF file not found, cannot list specific findings." >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo
            echo "#### Documentation"
            echo "- [Untrusted Checkout (High)](https://codeql.github.com/codeql-query-help/actions/actions-untrusted-checkout-high/)"
            echo "- [Artifact Poisoning (Critical)](https://codeql.github.com/codeql-query-help/actions/actions-artifact-poisoning-critical/)"
            echo "- [Cache Poisoning (Poisonable Step)](https://codeql.github.com/codeql-query-help/actions/actions-cache-poisoning-poisonable-step/)"
            echo "- [Envpath Injection (Critical)](https://codeql.github.com/codeql-query-help/actions/actions-envpath-injection-critical/)"
            echo "- [Envvar Injection (Critical)](https://codeql.github.com/codeql-query-help/actions/actions-envvar-injection-critical/)"
          } >> "$GITHUB_STEP_SUMMARY"
